name: Build Talk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt
      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Repair incomplete Linux sherpa native cache
        shell: bash
        run: |
          cache_root="$PWD/target/sherpa-onnx-prebuilt"
          native_dir="$(find "$cache_root" -type f -name libsherpa-onnx-c-api.so -printf '%h\n' -quit 2>/dev/null || true)"
          if [[ -z "$native_dir" || ! -f "$native_dir/libonnxruntime.so" ]]; then
            rm -rf -- "$cache_root"
            cargo clean -p sherpa-onnx-sys
            echo 'Invalidated incomplete Linux sherpa native cache; Cargo will restore it.'
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Run workspace tests
        run: cargo test --workspace --locked
      - name: Test ASR benchmark metrics and corpus integrity
        run: python -m unittest discover -s scripts/tests -p "test_asr_resources.py" -v
      - name: Validate workflow contracts
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./scripts/tests/GitHub-Actions.Tests.ps1 -CI

  build-windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46817827a5bfabe028bf34e1cce71fd40e2ff697 # 1.95.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: .

      - name: Repair incomplete sherpa native cache
        shell: powershell
        run: |
          $cacheRoot = Join-Path $PWD 'target\sherpa-onnx-prebuilt'
          $nativeLibrary = Get-ChildItem -LiteralPath $cacheRoot -File -Recurse -Filter 'sherpa-onnx-c-api.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nativeLibrary) {
            if (Test-Path -LiteralPath $cacheRoot) {
              Remove-Item -LiteralPath (Join-Path $PWD 'target\sherpa-onnx-prebuilt') -Recurse -Force
            }
            cargo clean -p sherpa-onnx-sys
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to invalidate the sherpa-onnx-sys build-script cache: $LASTEXITCODE"
            }
            Write-Host 'Invalidated incomplete sherpa native cache; Cargo will download or re-extract it.'
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Test ASR benchmark metrics and corpus integrity
        run: python -m unittest discover -s scripts/tests -p "test_asr_resources.py" -v

      - name: Build credential-free Windows package
        shell: powershell
        run: |
          Remove-Item Env:TALK_PROVIDER_API_KEY -ErrorAction SilentlyContinue
          $releaseRoot = Join-Path $PWD 'release\Talk'
          $versionId = "ci-$env:GITHUB_SHA"

          .\scripts\Publish-TalkRelease.ps1 `
            -VersionId $versionId `
            -ReleaseRoot $releaseRoot `
            -ProductProfile `
            -EmitEvidence `
            -SkipVerification `
            -SkipSmoke `
            -SkipNativePreflight `
            -SkipNativeReadiness

          $releaseDir = Join-Path $releaseRoot $versionId
          .\scripts\Test-TalkProductRelease.ps1 -ProductPath $releaseDir
          $configText = Get-Content -LiteralPath (Join-Path $releaseDir 'talk.toml') -Raw
          if ($configText -match '(?m)^\s*api_key\s*=') {
            throw 'CI release must not contain provider.api_key'
          }
          if ($configText -notmatch 'api_key_env\s*=\s*"TALK_PROVIDER_API_KEY"') {
            throw 'CI release must use provider.api_key_env'
          }

          "TALK_RELEASE_DIR=$releaseDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TALK_RELEASE_EVIDENCE_DIR=$(Join-Path (Join-Path $releaseRoot '_ci') $versionId)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Talk Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: talk-windows-x64-${{ github.sha }}
          path: ${{ env.TALK_RELEASE_DIR }}
          if-no-files-found: error

      - name: Upload Talk Windows validation evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: talk-windows-x64-evidence-${{ github.sha }}
          path: ${{ env.TALK_RELEASE_EVIDENCE_DIR }}
          if-no-files-found: error
